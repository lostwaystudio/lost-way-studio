<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The MOFD Studio</title>
    <!-- Подключаем шрифт Lobster (как в твоих стилях) и чистый гугл-шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* В точности повторяем градиент с картинки: от темно-синего/черного слева к синему справа */
            background: linear-gradient(115deg, #050518 0%, #0a0e38 30%, #172175 70%, #202eb5 100%);
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Анимированные золотистые лепестки/пламя на фоне */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle, #ffe993 0%, #ffd700 40%, #c59b27 80%, transparent 100%);
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
            opacity: 0.6;
            animation: floatWind 12s infinite ease-in-out;
        }

        /* Разные стилизованные формы лепестков из кадра */
        .petal-shape-1 {
            width: 35px;
            height: 70px;
            border-radius: 80% 0% 80% 0% / 80% 0% 80% 0%;
        }

        .petal-shape-2 {
            width: 25px;
            height: 55px;
            border-radius: 0% 80% 0% 80% / 0% 80% 0% 80%;
        }

        /* Анимация плавания/вивания лепестков как от легкого ветра */
        @keyframes floatWind {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(30px, -40px) rotate(15deg) scale(1.05);
                opacity: 0.7;
            }
            50% {
                transform: translate(10px, -90px) rotate(-10deg) scale(0.95);
                opacity: 0.8;
            }
            75% {
                transform: translate(45px, -140px) rotate(20deg) scale(1.1);
                opacity: 0.5;
            }
            100% {
                transform: translate(0, -200px) rotate(0deg) scale(1);
                opacity: 0;
            }
        }

        /* Основной контейнер */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* Верхняя плашка / Шапка */
        .header-banner {
            width: 100%;
            padding: 24px 30px;
            background: linear-gradient(180deg, #670087 0%, #4c006a 100%);
            border: 2px solid #ffd700;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25), inset 0 0 15px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .header-title {
            font-family: 'Lobster', 'Montserrat', cursive;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* Сетка из 6 карточек */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 950px;
        }

        /* Карточка секции */
        .card {
            aspect-ratio: 1.05 / 1;
            background: linear-gradient(145deg, #70008f 0%, #4a0063 100%);
            border: 2px solid #ffd700;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s ease, 
                        border-color 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(255, 215, 0, 0.1);
            text-decoration: none;
            color: #ffffff;
            overflow: visible;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: text-shadow 0.3s ease;
        }

        /* Эффект наведения (HOVER) */
        .card:hover {
            transform: scale(1.08) translateY(-5px);
            border-color: #fff2a3;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4), 
                        0 0 30px rgba(255, 215, 0, 0.3), 
                        inset 0 0 20px rgba(255, 215, 0, 0.3);
            z-index: 10;
        }

        .card:hover .card-title {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 215, 0, 0.8);
        }

        /* Блёстки вокруг карточки при наведении */
        .sparkles-container {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .card:hover .sparkles-container {
            opacity: 1;
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffe57f;
            animation: sparkleAnim 1.2s infinite ease-in-out;
        }

        @keyframes sparkleAnim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.4) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 850px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .header-title {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .header-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Анимированные фоновые золотые лепестки -->
    <div class="petals-container" id="petals"></div>

    <div class="main-container">
        <!-- Шапка Студии -->
        <header class="header-banner">
            <h1 class="header-title">The MOFD Studio</h1>
        </header>

        <!-- 6 интерактивных секций -->
        <main class="grid-container">
            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Проект</span>
            </div>
            
            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Части</span>
            </div>

            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Персонажи</span>
            </div>

            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Галерея</span>
            </div>

            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Авторы/Титры</span>
            </div>

            <div class="card">
                <div class="sparkles-container"></div>
                <span class="card-title">Будущие проекты</span>
            </div>
        </main>
    </div>

    <script>
        // Генерация золотистых лепестков на фоне
        const petalsContainer = document.getElementById('petals');
        const petalCount = 28;

        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            const shapeClass = Math.random() > 0.5 ? 'petal-shape-1' : 'petal-shape-2';
            petal.className = `petal ${shapeClass}`;
            
            // Случайные позиции по экрану
            petal.style.left = Math.random() * 100 + '%';
            petal.style.top = Math.random() * 100 + '%';
            
            // Случайные размеры и задержки анимации
            const scale = 0.5 + Math.random() * 0.8;
            const duration = 8 + Math.random() * 10;
            const delay = Math.random() * 10;
            
            petal.style.animationDuration = `${duration}s`;
            petal.style.animationDelay = `-${delay}s`;
            petal.style.transform = `scale(${scale})`;

            petalsContainer.appendChild(petal);
        }

        // Добавление анимированных блёсток вокруг карточек при наведении
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            const sparklesContainer = card.querySelector('.sparkles-container');
            const sparkleCount = 12;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // Расставляем блёстки по периметру карточки
                const side = Math.floor(Math.random() * 4);
                let top, left;

                if (side === 0) { // верх
                    top = Math.random() * 15 - 10 + '%';
                    left = Math.random() * 100 + '%';
                } else if (side === 1) { // право
                    top = Math.random() * 100 + '%';
                    left = 90 + Math.random() * 15 + '%';
                } else if (side === 2) { // низ
                    top = 90 + Math.random() * 15 + '%';
                    left = Math.random() * 100 + '%';
                } else { // лево
                    top = Math.random() * 100 + '%';
                    left = Math.random() * 15 - 10 + '%';
                }

                sparkle.style.top = top;
                sparkle.style.left = left;
                
                // Случайные размеры и задержка
                const size = 4 + Math.random() * 8;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.animationDelay = `${Math.random() * 1.2}s`;
                sparkle.style.animationDuration = `${0.8 + Math.random() * 0.8}s`;

                sparklesContainer.appendChild(sparkle);
            }
        });
    </script>
</body>
</html>
